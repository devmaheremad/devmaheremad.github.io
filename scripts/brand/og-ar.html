<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@700;800&family=IBM+Plex+Sans+Arabic:wght@400;500&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#07070a;color:#ecebe6}
body{position:relative;font-family:"IBM Plex Sans Arabic",sans-serif}
.blob{position:absolute;border-radius:50%;filter:blur(60px)}
.b1{width:620px;height:620px;left:-160px;top:-180px;background:radial-gradient(circle,rgba(76,195,255,.32),transparent 65%)}
.b2{width:560px;height:560px;left:120px;bottom:-300px;background:radial-gradient(circle,rgba(182,156,255,.26),transparent 65%)}
.orb{position:absolute;left:-60px;top:250px;width:300px;height:300px;border-radius:50%;
 background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),rgba(76,195,255,.35) 25%,rgba(40,60,110,.6) 55%,rgba(10,10,20,.9) 80%);box-shadow:0 0 120px rgba(76,195,255,.25)}
.wrap{position:absolute;right:72px;top:64px;left:72px}
.eye{font-family:"JetBrains Mono",monospace;font-size:20px;letter-spacing:.18em;color:#8b8b95;direction:ltr;text-align:right}
h1{font-family:Alexandria,sans-serif;font-weight:800;font-size:118px;line-height:1.08;margin:34px 0 0}
h1 i{font-style:normal;color:#4cc3ff}
.en{direction:ltr;text-align:right;font-family:Alexandria,sans-serif;font-weight:700;font-size:34px;margin-top:22px;
 background:linear-gradient(100deg,#4cc3ff,#b69cff);-webkit-background-clip:text;color:transparent}
.role{font-family:Alexandria,sans-serif;font-weight:700;font-size:44px;margin-top:26px}
.sub{font-size:27px;color:rgba(236,235,230,.78);margin-top:14px;max-width:820px;line-height:1.6}
.foot{position:absolute;right:72px;bottom:52px;display:flex;align-items:center;gap:14px;font-size:24px;font-weight:500}
.dot{width:14px;height:14px;border-radius:50%;background:#34d399;box-shadow:0 0 16px #34d399}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div><div class="orb"></div>
<div class="wrap">
 <div class="eye">( PORTFOLIO ) — DEVMAHEREMAD.COM/AR</div>
 <h1>ماهر المشهراوي<i>.</i></h1>
 <div class="en">Maher Almashharawi · Senior Frontend Engineer</div>
 <div class="role">مهندس برمجيات أول</div>
 <div class="sub">متخصص في الواجهات الأمامية: React وNext.js وTypeScript لمنتجات SaaS والتجارة الإلكترونية وأنظمة الحجز.</div>
</div>
<div class="foot"><span class="dot"></span>متاح الآن · عن بُعد أو هجين أو من المكتب · منفتح على الانتقال</div>
</body></html>
